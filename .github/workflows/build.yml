name: Build

# Builds Qivot Studio on macOS, Windows and Linux and runs ctest: the core tests
# plus a smoke test that loads the whole app offscreen and fails on any QML warning.
# One extra job builds against Qt 5.15, which Studio still supports.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,          os: macos-15,       qt: 6.8.3,  arch: clang_64 }
          - { name: Windows,        os: windows-latest, qt: 6.8.3,  arch: win64_msvc2022_64 }
          - { name: Linux,          os: ubuntu-24.04,   qt: 6.8.3,  arch: linux_gcc_64 }
          - { name: Linux (Qt 5.15), os: ubuntu-22.04,  qt: 5.15.2, arch: gcc_64 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          cache: true

      # Qt Quick's offscreen platform still needs GL and font libraries on Linux.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1 libxkbcommon0 libfontconfig1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash          # with pipefail: a failed build fails the step, through tee
        run: cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Everything every test printed, whatever ctest showed above (it can come
      # back empty, e.g. when a test dies before flushing).
      - name: Test log
        if: failure()
        run: cmake -E cat build/Testing/Temporary/LastTest.log

      # The same, as an annotation on the run: unlike the log, annotations can
      # be read without signing in to GitHub (in the run's summary, or the API).
      - name: Annotate failures
        if: failure()
        shell: python
        run: |
          import os, pathlib, re, shlex, subprocess
          log = pathlib.Path("build/Testing/Temporary/LastTest.log")
          if not log.exists():
              # It didn't build: the compiler's errors are what to see.
              build = pathlib.Path("build.log")
              lines = build.read_text(errors="replace").splitlines() if build.exists() else []
              errors = [l for l in lines if re.search(r"\berror\b|: fatal|undefined reference|Undefined symbols", l, re.I)]
              body = "\n".join((errors or lines[-40:])[:25])[-3500:] or "No build.log either: it failed before building."
              print("::error title=Build failed::" + body.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
              raise SystemExit
          text = log.read_text(errors="replace")
          # One block per test: keep the ones that didn't pass.
          blocks = re.split(r"\n(?=\d+/\d+ Testing: )", text)
          failed = [b for b in blocks if "Test Passed." not in b and "Testing:" in b] or [text]
          for b in failed[:5]:
              name = re.search(r"Testing: (\S+)", b)
              # Run it again on its own: ctest's log can lose a crashed test's
              # output, and doesn't say how it ended. Exit codes like 0xC0000005
              # (access violation) or 0xC00000FD (stack overflow) do.
              command = re.search(r"^Command: (.*)$", b, re.M)
              directory = re.search(r"^Directory: (.*)$", b, re.M)
              if command:
                  try:
                      args = [a.strip('"') for a in shlex.split(command.group(1), posix=False)]
                      # A QtTest program also writes its report to a file, which
                      # doesn't depend on the console's buffering.
                      report = pathlib.Path(f"{name.group(1) if name else 'test'}-report.txt").resolve()
                      if not any(a.startswith("--") for a in args[1:]):
                          args += ["-o", f"{report},txt"]
                      # As ctest runs the app's tests: without a display.
                      env = dict(os.environ, QT_QPA_PLATFORM=os.environ.get("QT_QPA_PLATFORM", "offscreen"))
                      run = subprocess.run(args, env=env,
                                           cwd=directory.group(1) if directory else None,
                                           capture_output=True, text=True, errors="replace", timeout=900)
                      b += f"\n--- run again: exit code {run.returncode} (0x{run.returncode & 0xFFFFFFFF:08X})\n"
                      b += (run.stdout + run.stderr)[-8000:]
                      if report.exists():
                          b += "\n--- its report:\n" + report.read_text(errors="replace")[-8000:]
                  except Exception as e:
                      b += f"\n--- couldn't run it again: {e}\n"
              body = b[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={name.group(1) if name else 'tests'} failed::{body}")

      # A screenshot of the real app on every run, so UI changes are visible in review.
      - name: Screenshot
        if: runner.os == 'macOS'
        run: |
          "build/app/Qivot Studio.app/Contents/MacOS/Qivot Studio" \
            --sample --table book --light --shot studio.png
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: screenshot
          path: studio.png
          if-no-files-found: ignore
