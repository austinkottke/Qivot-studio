name: Release

# Builds the macOS DMG (universal: Apple Silicon and Intel) with
# tools/package-macos.sh and checks the app inside it starts cleanly.
# It only runs when started by hand: Actions > Release > Run workflow, choosing
#   - the version (blank: the one in CMakeLists.txt)
#   - whether to publish it as a GitHub Release (tag v<version>), or just keep
#     the DMG as the run's artifact
# or from the command line: gh workflow run release.yml -f version=0.2.0 -f publish=true
#
# Signing: without secrets the app is signed ad hoc, so macOS asks users to
# right-click > Open it the first time. To sign and notarize it, add these
# repository secrets:
#   MACOS_CERT_P12         base64 of a "Developer ID Application" certificate (.p12)
#   MACOS_CERT_PASSWORD    its password
#   MACOS_SIGN_IDENTITY    e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   (an app-specific password) for notarization

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (blank: the one in CMakeLists.txt)"
        required: false
        default: ""
      publish:
        description: "Publish as a GitHub Release (tag v<version>)"
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false          # a second run waits; never cut off one that's publishing

permissions:
  contents: write          # to create the GitHub Release and its tag

jobs:
  macos-dmg:
    name: macOS DMG
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: clang_64
          cache: true

      - name: Version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          [ -n "$version" ] || version=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Build the DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ env.HAS_CERT == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: tools/package-macos.sh "$QT_ROOT_DIR" "$VERSION" dist

      - name: Notarize
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/*.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/*.dmg

      # The app in the DMG must start and load every screen without a QML warning.
      - name: Check the app in the DMG
        run: |
          mnt=$(hdiutil attach -nobrowse -readonly dist/*.dmg | tail -1 | sed 's/.*\(\/Volumes\/.*\)/\1/')
          app="$mnt/Qivot Studio.app/Contents/MacOS/Qivot Studio"
          lipo -archs "$app"
          "$app" --sample --smoke
          "$app" --sample --view design --design-demo --smoke
          "$app" --sample --builder-demo --smoke
          "$app" --sample --table book --view profile --smoke --shot-delay 2500
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: Qivot-Studio-${{ env.VERSION }}-macOS
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          gh release create "v$VERSION" dist/*.dmg --target "$GITHUB_SHA" \
            --title "Qivot Studio $VERSION" --generate-notes $PRERELEASE
